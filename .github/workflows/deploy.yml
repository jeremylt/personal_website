name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build documentation
        run: |
          make html
          touch build/html/.nojekyll
          sed -i -- 's/<meta name="viewport" content="width=device-width, initial-scale=0\.9, maximum-scale=0\.9" \/>/ /g' build/html/index.html
          echo 'jeremylt.org' > build/html/CNAME
          cp source/robots.txt build/html/robots.txt
          rm .gitignore
      - name: Deploy website
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/html
